services:
  ze-erp-frontend:
    container_name: ze-erp-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: http://192.168.0.150:7002
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "7002:4000" # LAN access only (no port forwarding to WAN) — matches `next start -p 4000` in package.json
    networks:
      - ze-erp-net

networks:
  ze-erp-net:
    external: true
